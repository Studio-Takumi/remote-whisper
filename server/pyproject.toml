[project]
name = "remote-whisper"
version = "0.1.0"
description = "Pseudo-real-time transcription on a remote GPU machine"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.2",
    "numpy",
    "pyyaml>=6",
    "httpx>=0.27",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32' or sys_platform == 'linux'",
    "pypdf[crypto]>=5",
    "nvidia-ml-py>=13.615.71",
]

[project.optional-dependencies]
# 録音後に作る最終の文字起こし（#121）。WhisperX（faster-whisper でまとめて文字起こし →
# wav2vec2 で単語の時刻 → pyannote で話者分け）。torch（CUDA）などで数 GB になるので、
# 入れるかは選べる（`uv sync --extra final`）。入れなければ、最終の文字起こしは作らない
final = [
    "whisperx>=3.8.6,<3.9",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "torchvision==0.23.*",
]

[project.scripts]
remote-whisper = "remote_whisper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

# PyPI の torch は Windows では CPU 版なので、Windows と Linux は PyTorch の CUDA 12.8 版を使う
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
