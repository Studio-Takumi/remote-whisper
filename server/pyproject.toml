[project]
name = "remote-whisper"
version = "0.1.0"
description = "Pseudo-real-time transcription on a remote GPU machine"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.2",
    "numpy",
    "pyyaml>=6",
    "httpx>=0.27",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32' or sys_platform == 'linux'",
    "pypdf[crypto]>=5",
    "nvidia-ml-py>=13.615.71",
    # クラウド版のホストの鍵（Ed25519）と署名（#158）。pypdf[crypto] でも入っているが、直接使うので書く
    "cryptography>=44",
    # タスクトレイ（Windows。#135）とメニューバー（Mac。#136）
    "pystray>=0.19; sys_platform == 'win32' or sys_platform == 'darwin'",
    "pillow>=10; sys_platform == 'win32' or sys_platform == 'darwin'",
    # Mac の GPU で録音中の文字起こしをする（#276。Apple Silicon だけ）
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.optional-dependencies]
# 録音後に作る最終の文字起こし（#121）。WhisperX（faster-whisper でまとめて文字起こし →
# wav2vec2 で単語の時刻 → pyannote で話者分け）。torch（CUDA）などで数 GB になるので、
# 入れるかは選べる（`uv sync --extra final`）。入れなければ、最終の文字起こしは作らない
final = [
    "whisperx>=3.8.6,<3.9",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "torchvision==0.23.*",
    # 行を語の境目で区切る（#141）。形態素解析と、その辞書（約 50MB）
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
]

[project.scripts]
remote-whisper = "remote_whisper.__main__:main"

# コンソールを出さずに起動する（Windows では pythonw。状態はタスクトレイで見る。#135）
[project.gui-scripts]
remote-whisper-gui = "remote_whisper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

# PyPI の torch は Windows では CPU 版なので、Windows と Linux は PyTorch の CUDA 12.8 版を使う
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
