[project]
name = "remote-whisper"
version = "0.1.0"
description = "Pseudo-real-time transcription on a remote GPU machine"
readme = "../README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "faster-whisper>=1.2",
    "pyyaml>=6",
    "httpx>=0.27",
    "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.scripts]
remote-whisper = "remote_whisper.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
