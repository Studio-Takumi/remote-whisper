<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- アプリのアイコン（#284）。ターミナルの「>」の後ろに音声の波形が続き、最後の 1 本が赤いカーソル。
       pwa-192/512.png・apple-touch-icon.png はこれを書き出したもの。角は OS が丸めるので正方形のまま塗り、
       maskable で丸く切られても欠けないよう、中身は中央の円（半径 40%）に収める -->
  <rect width="512" height="512" fill="#0F1115"/>
  <polyline points="120,188 180,256 120,324" fill="none" stroke="#2BB3A3"
            stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#E8ECEF">
    <rect x="228" y="220" width="28" height="72"  rx="14"/>
    <rect x="276" y="172" width="28" height="168" rx="14"/>
    <rect x="324" y="200" width="28" height="112" rx="14"/>
  </g>
  <rect x="372" y="156" width="40" height="200" rx="8" fill="#FF5A4E"/>
</svg>
