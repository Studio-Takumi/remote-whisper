# Windows の配布用のビルドとインストーラ（#168）と、Mac の .app と .dmg（#292）
#
# 数 GB のダウンロード・展開があるので、PR では動かさない（PR では packaging/ を変えたときの文法チェックだけ）。
# 手で動かすとき（Actions の画面から。ブランチと、作るもの（両方・Windows だけ・Mac だけ）を選べる）と、
# v* のタグを push したときに動く（タグのときは両方）。
# 配布物は 3 つ（#408）: Windows（CUDA）版・Windows（OpenVINO）版・Mac 版。それぞれインストーラか .dmg と
# 説明（README.txt）を zip に包み（remote-whisper-<版>-win-cuda.zip・-win-openvino.zip・-mac-mlx.zip）、
# artifact に置く。タグのときは、SHA256SUMS.txt と一緒に下書きのリリースにも付ける
# （- を含むタグ（v1.0.0-rc1 など）はプレリリースにする）
name: Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 作るもの
        type: choice
        options: [both, windows, mac]
        default: both
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/package.yml

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # PR のときの軽い確認。スクリプトの文法だけ見る（ビルドはしない）
  check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem packaging -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($file.Name): $_" }; $failed = $true }
            else { Write-Host "ok: $($file.Name)" }
          }
          if ($failed) { exit 1 }

  # Mac の側の軽い確認（#292）。シェルの文法と Info.plist の形だけ見る
  check-mac:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Parse shell scripts and Info.plist
        run: |
          set -euo pipefail
          for file in packaging/*.sh packaging/mac/*.sh; do
            bash -n "$file"
            echo "ok: $file"
          done
          plutil -lint packaging/mac/Info.plist

  # Windows の 2 つの版（#408）。cuda は CUDA の DLL と OpenVINO、openvino は OpenVINO だけ
  windows:
    if: github.event_name != 'pull_request' && inputs.target != 'mac'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [cuda, openvino]
    # ビルドには書き込みの権限を付けない（リリースを作るのは、下の別のジョブ）
    permissions:
      contents: read
    env:
      # 本番のサーバー（8000 番）とは別のポート
      SMOKE_PORT: "18168"
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          # 版を固定する（ビルドを同じ道具で作り直せるように）
          version: "0.13.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 版: タグのときはタグ名（先頭の v を除く）、そうでなければコミットの短いハッシュ
      - name: Decide the version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = (& git rev-parse --short HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          }
          $version = "$version".Trim()
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z._+-]*$') { throw "invalid version: $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version: $version"

      - name: Build the app folder
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/build.ps1 -OutDir "$env:RUNNER_TEMP/rw-build" -Version $env:VERSION -Edition $env:EDITION

      # インストールせずに、ビルドしたフォルダから動かして確かめる
      - name: Smoke test (build folder)
        shell: pwsh
        run: ./packaging/smoke.ps1 -AppDir "$env:RUNNER_TEMP/rw-build/app" -DataDir "$env:RUNNER_TEMP/rw-data-folder" -Port $env:SMOKE_PORT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --yes --no-progress

      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:VERSION
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$version" "/DEdition=$env:EDITION" "/DSourceDir=$env:RUNNER_TEMP\rw-build\app" "/DOutputDir=$env:RUNNER_TEMP\rw-installer" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\rw-installer" | Format-Table Name, Length

      # ビルドしたフォルダはもう要らない（ディスクを空ける）
      - name: Remove the build folder
        shell: pwsh
        run: Remove-Item -Recurse -Force "$env:RUNNER_TEMP/rw-build"

      # インストーラを /VERYSILENT で入れ、同じ確認をして、アンインストールする
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\rw-installer" -Filter "remote-whisper-*-win-$env:EDITION-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'the installer was not found' }
          $dir = "$env:RUNNER_TEMP\rw-installed"
          $p = Start-Process $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", '/TASKS=startup', "/LOG=$env:RUNNER_TEMP\setup.log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup failed ($($p.ExitCode))" }
          if (-not (Test-Path "$dir\python\pythonw.exe")) { throw 'not installed' }
          # 「ログオン時に起動」を選んだので、Run の値ができている
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').RemoteWhisper
          Write-Host "Run: $run"
          if (-not $run -or $run -notlike "*$dir*") { throw 'the startup entry was not created' }
          # スタートメニューのショートカット
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Remote Whisper.lnk'
          if (-not (Test-Path $link)) { throw 'the Start menu shortcut was not created' }
          # ショートカットに専用のアイコンが付いている（#290）
          $icon = (New-Object -ComObject WScript.Shell).CreateShortcut($link).IconLocation
          Write-Host "Icon: $icon"
          if ($icon -notlike "*$dir*remote-whisper.ico*" -or -not (Test-Path "$dir\remote-whisper.ico")) { throw 'the shortcut does not use the app icon' }

      - name: Smoke test (installed)
        shell: pwsh
        run: ./packaging/smoke.ps1 -AppDir "$env:RUNNER_TEMP/rw-installed" -DataDir "$env:RUNNER_TEMP/rw-data-installed" -Port $env:SMOKE_PORT

      - name: Uninstall (the data folder must stay)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\rw-installed"
          $p = Start-Process "$dir\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
          # アンインストーラは一時の場所に自分をコピーして動かすので、少し待って消えるのを確かめる
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\python"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\python") { throw 'the app folder was not removed' }
          if (-not (Test-Path "$env:RUNNER_TEMP\rw-data-installed\log\server.log")) { throw 'the data folder was removed' }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).RemoteWhisper
          if ($run) { throw 'the startup entry was not removed' }
          Write-Host 'ok: uninstalled, the data folder is kept'

      # インストーラと説明を zip に包む（#408）
      - name: Make the zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\rw-installer" -Filter "remote-whisper-*-win-$env:EDITION-setup.exe" | Select-Object -First 1
          $stage = "$env:RUNNER_TEMP\rw-zip-stage"
          New-Item -ItemType Directory -Force $stage, "$env:RUNNER_TEMP\rw-zip" | Out-Null
          Copy-Item $setup.FullName $stage
          Copy-Item packaging/readme/windows.txt (Join-Path $stage 'README.txt')
          $zip = "$env:RUNNER_TEMP\rw-zip\remote-whisper-$env:VERSION-win-$env:EDITION.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Write-Host ('{0}: setup {1:N0} MB, zip {2:N0} MB' -f $env:EDITION, ($setup.Length / 1MB), ((Get-Item $zip).Length / 1MB))
          Write-Host "SHA256 $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $zip -Leaf)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-whisper-win-${{ matrix.edition }}
          path: ${{ runner.temp }}/rw-zip/remote-whisper-*-win-${{ matrix.edition }}.zip
          # 中の exe はすでに圧縮してある
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload the setup log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-log-${{ matrix.edition }}
          path: ${{ runner.temp }}/setup.log
          if-no-files-found: ignore

  # Mac（Apple シリコン）の .app と .dmg（#292）。macos-latest は arm64
  mac:
    if: github.event_name != 'pull_request' && inputs.target != 'windows'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SMOKE_PORT: "18292"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          version: "0.13.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 版の決め方は Windows と同じ
      - name: Decide the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      - name: Build the app and the dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uname -m
          sw_vers
          packaging/build-mac.sh --out-dir "$RUNNER_TEMP/rw-mac" --version "$VERSION"

      # .dmg に入れる前の .app から動かして確かめる
      - name: Smoke test (build)
        run: packaging/smoke-mac.sh "$RUNNER_TEMP/rw-mac/Remote Whisper.app" "$RUNNER_TEMP/rw-data-app" "$SMOKE_PORT"

      # .dmg を開いて、利用者と同じように .app を写し、同じ確認をする
      - name: Install from the dmg
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rw-mac/Remote Whisper.app"
          dmg="$(ls "$RUNNER_TEMP"/rw-mac/remote-whisper-*-mac-mlx.dmg)"
          mnt="$RUNNER_TEMP/rw-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          # .dmg には .app と、アプリケーションへの記号リンクが入っている
          test -d "$mnt/Remote Whisper.app"
          test "$(readlink "$mnt/Applications")" = /Applications
          mkdir -p "$RUNNER_TEMP/rw-installed"
          ditto "$mnt/Remote Whisper.app" "$RUNNER_TEMP/rw-installed/Remote Whisper.app"
          hdiutil detach "$mnt"

      - name: Smoke test (installed)
        run: packaging/smoke-mac.sh "$RUNNER_TEMP/rw-installed/Remote Whisper.app" "$RUNNER_TEMP/rw-data-installed" "$SMOKE_PORT"

      # .dmg と説明を zip に包む（#408）
      - name: Make the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dmg="$(ls "$RUNNER_TEMP"/rw-mac/remote-whisper-*-mac-mlx.dmg)"
          stage="$RUNNER_TEMP/rw-zip-stage"
          mkdir -p "$stage" "$RUNNER_TEMP/rw-zip"
          cp "$dmg" "$stage/"
          cp packaging/readme/mac.txt "$stage/README.txt"
          zip="$RUNNER_TEMP/rw-zip/remote-whisper-$VERSION-mac-mlx.zip"
          # -j: フォルダを付けない、-X: 拡張属性などを入れない
          (cd "$stage" && zip -j -X "$zip" ./*)
          unzip -l "$zip"
          echo "SHA256 $(shasum -a 256 "$zip" | cut -d ' ' -f 1)  $(basename "$zip")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-whisper-mac-mlx
          path: ${{ runner.temp }}/rw-zip/remote-whisper-*-mac-mlx.zip
          # 中の dmg はすでに圧縮してある
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  # タグのときだけ、下書きのリリースを作る。書き込みの権限はこのジョブだけに付ける
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # 3 つの zip（win-cuda・win-openvino・mac-mlx）を 1 つのフォルダに
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: remote-whisper-*
          path: dist
          merge-multiple: true
      - name: Create a draft release
        run: |
          set -euo pipefail
          cd dist
          ls -la
          test "$(ls remote-whisper-*.zip | wc -l)" -eq 3
          # 利用者が、落とした zip と比べられるように（docs/install-*.md）。Safari は zip を自動で展開して
          # 消すので、中のインストーラと .dmg の値も書く
          sha256sum remote-whisper-*.zip > SHA256SUMS.txt
          for zip in remote-whisper-*.zip; do
            for entry in $(unzip -Z1 "$zip" | grep -E '\.(exe|dmg)$'); do
              echo "$(unzip -p "$zip" "$entry" | sha256sum | cut -d ' ' -f 1)  $entry" >> SHA256SUMS.txt
            done
          done
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
          # - を含むタグ（v1.0.0-rc1 など）はプレリリース
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" remote-whisper-*.zip SHA256SUMS.txt --draft "${prerelease[@]}" --generate-notes --title "$TAG"
