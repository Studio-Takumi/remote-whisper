# lint・format・テスト（#169）。GPU・Ollama・HuggingFace のトークンは使わない（要るテストは skip になる）
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 依存に新しい脆弱性が見つかることがあるので、コードを変えなくても週 1 回 audit を回す（#287）。
  # schedule のときは audit だけ動かす（ほかのジョブは if で飛ばす）
  schedule:
    - cron: "17 21 * * 0"

# 読むだけ（#166）
permissions:
  contents: read

# 同じブランチに続けて push したら、古い方の実行は止める
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || 'run' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    if: github.event_name != 'schedule'
    # Windows だけのテスト（パスの扱い・タスクトレイ）があるので、windows でも回す
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      # CUDA のライブラリ（合わせて 1GB ほど）はテストに要らないので入れない。WhisperX などの extra も入れない
      - name: Install
        run: uv sync --locked --no-install-package nvidia-cublas-cu12 --no-install-package nvidia-cudnn-cu12
      - name: Lint
        run: uv run --no-sync ruff check
      - name: Format
        run: uv run --no-sync ruff format --check
      - name: Test
        run: uv run --no-sync pytest

  # 依存の既知の脆弱性を見る（#287）。pip-audit は重大度を返さないので、落とさずに一覧を出すだけにする。
  # torch は CUDA 12.8 版・torchaudio・pyannote との組み合わせを固定していて上げられず、脆弱性の多くは
  # 信用できないファイルを torch.load で読むときのもの（読むのは Hugging Face の決まったモデルだけ）なので、一覧から外す
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Audit
        run: |
          uv export --frozen --no-dev --extra final --no-emit-project --no-hashes --no-header \
            | grep -v -E '^(torch|torchaudio|torchvision)==' > audit-requirements.txt
          echo "::notice title=pip-audit::torch・torchaudio・torchvision は固定していて上げられないので、監査から外している（#287）"
          # pip-audit の終了コード: 0 = 見つからず、1 = 脆弱性あり、それ以外 = ツール自体の失敗
          # （ネットワーク・OSV の障害など）。脆弱性は警告にとどめ、ツールの失敗は赤くする
          status=0
          uvx pip-audit -r audit-requirements.txt --no-deps --disable-pip || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=pip-audit::既知の脆弱性のある依存があります（上の一覧）"
          elif [ "$status" -ne 0 ]; then
            echo "::error title=pip-audit::pip-audit 自体が失敗しました（終了コード $status）"
            exit "$status"
          fi

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      # 型チェック（tsc -b）とビルド
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  # クラウド版の中間サーバー（#154）。Workers の実行環境（workerd）の中で、ローカルの D1 ごとテストする
  relay:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
